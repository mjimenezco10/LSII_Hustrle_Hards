# SonarCloud "Automatic Analysis" (the GitHub app that checks every PR) reads this file, not sonar-project.properties,
# which is used by the scanner of compose.yaml (local SonarQube) and by the CI step. Keep both in sync.
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/__tests__/**,frontend/src/**/__mocks__/**,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/src/**/__tests__/**,frontend/src/**/__mocks__/**,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# The translations (src/i18n/messages) repeat the same keys in English, Spanish and Catalan by design: not duplicated code
sonar.cpd.exclusions=frontend/src/i18n/messages/**
