server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches spring.servlet.multipart.max-request-size
    client_max_body_size 105M;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /media/<file> is answered by the backend: the file itself (local storage) or a redirect to /storage/<file>
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Static storage: files of the public S3 bucket (s3 service of compose.yaml), streamed without going through the
    # backend. Range requests pass through, so videos can be seeked
    location /storage/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://s3:8333/protube-media/;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # SPA fallback so client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
