# Full ProTube stack (NFR-03): `docker compose up --build` from the repo root, then open http://localhost:8080
# (nginx serves the SPA and routes /api and /media to the backend)
# Every variable has a default, so no .env file is needed; override them in a root .env file if required.

services:
  db:
    image: postgres:16
    container_name: protube_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-protube}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-protube}
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube}
    ports:
      - "${PROTUBE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # A real query (not pg_isready) so a volume initialised with other credentials shows up as unhealthy
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: protube_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Trailing slash required: MvcConfig maps /media/** to file:${pro_tube.store.dir}
      ENV_PROTUBE_STORE_DIR: /data/videos/
      # Import the videos of the store into PostgreSQL on startup (already imported ones are skipped)
      ENV_PROTUBE_LOAD_INITIAL_DATA: ${ENV_PROTUBE_LOAD_INITIAL_DATA:-true}
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-protube}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS:-protube}
      # "Sign in with Google" (empty disables it). Only the backend needs it: the frontend reads it from
      # GET /api/auth/google/config
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-}
      # Key that signs the session tokens. Fixed, so sessions (and their refresh tokens) survive a backend restart;
      # set your own (>= 32 chars) in .env outside local development
      ENV_PROTUBE_JWT_SECRET: ${ENV_PROTUBE_JWT_SECRET:-docker-only-protube-secret-change-me-0123456789}
      # Access token lifetime (minutes); it is renewed with the refresh token, which lasts ENV_PROTUBE_JWT_REFRESH_DAYS
      ENV_PROTUBE_JWT_EXPIRATION_MINUTES: ${ENV_PROTUBE_JWT_EXPIRATION_MINUTES:-60}
      ENV_PROTUBE_JWT_REFRESH_DAYS: ${ENV_PROTUBE_JWT_REFRESH_DAYS:-30}
    ports:
      # Only for debugging: the browser goes through the frontend (8080). 8081 is used by the E2E tests
      - "${PROTUBE_BACKEND_PORT:-8082}:8080"
    volumes:
      # Video store generated by tooling/videoGrabber (.mp4/.webp/.json triples): the same ENV_PROTUBE_STORE_DIR used
      # to run the backend outside Docker (else the older PROTUBE_STORE_DIR, else ./videos)
      - ${ENV_PROTUBE_STORE_DIR:-${PROTUBE_STORE_DIR:-./videos}}:/data/videos

  frontend:
    build:
      context: ./frontend
    container_name: protube_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # nginx: the SPA plus /api and /media routed to the backend, all on http://localhost:8080
      - "${PROTUBE_FRONTEND_PORT:-8080}:80"

  # Code quality (optional): only started with `--profile sonar`, see DEVELOPMENT.md "Code quality (SonarQube)"
  sonarqube:
    image: sonarqube:community
    container_name: protube_sonarqube
    profiles: [sonar]
    environment:
      # Single-node Elasticsearch on a dev machine: skip the production kernel checks
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${PROTUBE_SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  # One-off scan of the repo: `docker compose --profile sonar run --rm sonar-scanner` (reads sonar-project.properties)
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: [sonar]
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
