spring.application.name=protube-back
server.port=8080
spring.thymeleaf.prefix=classpath:/static/

# US-06 uploads: a video of up to 100 MB plus its thumbnail (2 MB). Keep in sync with frontend/docker/nginx.conf
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

spring.profiles.active=@spring.profiles.active@

# Before running the process you must have this system-level environment variable set: ENV_PROTUBE_STORE_DIR
# It must hold the absolute path to the directory containing the videos (and any other file-based storage)
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR}

# Where uploaded videos, thumbnails and avatars are kept (StorageConfig): local (default, the folder above, served under
# /media) or s3 (a bucket: AWS S3 or an S3-compatible server such as SeaweedFS in compose.yaml; /media redirects the browser to public-url). With s3 the
# videos of the store above are copied to the bucket on startup when pro_tube.load_initial_data is true
pro_tube.storage.type=${ENV_PROTUBE_STORAGE:local}
pro_tube.storage.s3.bucket=${ENV_PROTUBE_S3_BUCKET:protube-media}
pro_tube.storage.s3.region=${ENV_PROTUBE_S3_REGION:us-east-1}
# Empty for AWS; the URL of the S3-compatible server otherwise (e.g. http://s3:8333)
pro_tube.storage.s3.endpoint=${ENV_PROTUBE_S3_ENDPOINT:}
# Empty to use the default AWS credentials (env vars, profile, IAM role)
pro_tube.storage.s3.access-key=${ENV_PROTUBE_S3_ACCESS_KEY:}
pro_tube.storage.s3.secret-key=${ENV_PROTUBE_S3_SECRET_KEY:}
# URL the browser downloads the files from, e.g. /storage (nginx in front of SeaweedFS) or https://<bucket>.s3.<region>.amazonaws.com
pro_tube.storage.s3.public-url=${ENV_PROTUBE_S3_PUBLIC_URL:/storage}

# JWT used to keep users logged in. Set ENV_PROTUBE_JWT_SECRET (>= 32 chars) outside local development
pro_tube.jwt.secret=${ENV_PROTUBE_JWT_SECRET:dev-only-protube-secret-change-me-0123456789}
# Access token sent with every request (short) and refresh token that renews it (long): the session stays open
# while the user comes back before the refresh token expires
pro_tube.jwt.expiration-minutes=${ENV_PROTUBE_JWT_EXPIRATION_MINUTES:60}
pro_tube.jwt.refresh-expiration-days=${ENV_PROTUBE_JWT_REFRESH_DAYS:30}

# "Sign in with Google": OAuth client id from Google Cloud Console (not a secret). Empty disables Google login
pro_tube.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:}

# i18n: error messages in messages*.properties (en default, es, ca), chosen by the Accept-Language header (LocaleConfig)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# NFR-01: PostgreSQL in every profile (no H2 or in-memory database). The defaults match the `db` service of
# compose.yaml (`docker compose up -d db`), so a local run needs no extra variables
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:${ENV_PROTUBE_DB_PORT:5432}/${ENV_PROTUBE_DB:protube}
spring.datasource.username=${ENV_PROTUBE_DB_USER:protube}
spring.datasource.password=${ENV_PROTUBE_DB_PASS:protube}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Documentation: OpenAPI description at /v3/api-docs and Swagger UI at /swagger-ui.html, only for the REST API
springdoc.paths-to-match=/api/**

#---
spring.config.activate.on-profile=dev
# Imports the video store on every startup (idempotent: already imported videos are skipped)
pro_tube.load_initial_data=true

#---
spring.config.activate.on-profile=prod
# Imports the video store on startup when true (idempotent: already imported videos are skipped)
pro_tube.load_initial_data=${ENV_PROTUBE_LOAD_INITIAL_DATA:false}
