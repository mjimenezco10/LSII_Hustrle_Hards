# Tests only (classpath:/config/ overrides src/main/resources/application.properties).
# NFR-01: no H2 even in tests. Testcontainers starts a throwaway PostgreSQL 16 in Docker on the first connection and
# removes it when the test JVM ends, so every `mvn verify` starts from an empty database. Needs Docker running.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///protube_test?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
